# A science-track project. Its gates run in this order and stop at the first failure; the
# golden gate compares reference runs with tests/golden/ within the tolerances of science.toml.
schema = 1

[privacy]
mode = "default"

[budgets]
tokens = 400000
wall_seconds = 2400

[tracks.science]
gates = ["format", "lint", "protected", "impacted_tests", "golden", "full_tests"]
offline = true                      # the default for this track
