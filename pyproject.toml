[project]
name = "stepswitch"
version = "0.1.0.dev0"
description = "Model-selective, multi-agent coding orchestrator that picks a model and harness per task and per step."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "typer>=0.26",
  "fastapi>=0.135",
  "uvicorn>=0.54",
  "pydantic>=2.14,<3",
  "httpx>=0.28.1,<1",
  "ruamel.yaml>=0.19.1",
  "jsonschema>=4.26",
  # Imported directly: offline schema validation with no remote $ref retrieval (ADR 0016).
  "jsonschema-specifications>=2025.9.1",
  "referencing>=0.37",
  # Science-track gates compare numerical outputs (SPEC §6.2). numpy 2.5 needs Python 3.12.
  "numpy>=2.4.6; python_version < '3.12'",
  "numpy>=2.5.3; python_version >= '3.12'",
]

[project.scripts]
ssw = "stepswitch.cli:main"
stepswitch = "stepswitch.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.17",
  "mypy>=2.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stepswitch"]

[tool.hatch.build.targets.wheel.force-include]
# The model and worker registry ships inside the package (ADR 0002, ADR 0012), and so do the
# science-track glossaries (SPEC §6.2).
"registry" = "stepswitch/_registry"
"science/glossaries" = "stepswitch/_science/glossaries"

[tool.uv]
# uv-managed interpreters bundle a SQLite without the WAL-reset bug (ADR 0002).
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
  "claim(id): links a claim test to an entry in claims/claims.yaml (SPEC §18.2)",
  "live: needs a running model server or the model hub (STEPSWITCH_LIVE_HUB=1); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["stepswitch"]

[[tool.mypy.overrides]]
# jsonschema ships no type information and its stub package is not a dependency.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
