[project]
name = "stepswitch"
version = "0.1.0.dev0"
description = "Model-selective, multi-agent coding orchestrator that picks a model and harness per task and per step."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "typer>=0.26",
  "fastapi>=0.135",
  "uvicorn>=0.54",
  "pydantic>=2.14,<3",
  "httpx>=0.28.1,<1",
  "ruamel.yaml>=0.19.1",
  "jsonschema>=4.26",
  # Imported directly: offline schema validation with no remote $ref retrieval (ADR 0016).
  "jsonschema-specifications>=2025.9.1",
  "referencing>=0.37",
  # Science-track gates compare numerical outputs (SPEC §6.2). numpy 2.5 needs Python 3.12.
  "numpy>=2.4.6; python_version < '3.12'",
  "numpy>=2.5.3; python_version >= '3.12'",
  # Definitions and references for the repository map, offline from pinned grammar wheels
  # (TK2, ADR 0024). The ABI-15 grammars need tree-sitter 0.25 or later.
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-c>=0.24.2",
  "tree-sitter-cpp>=0.23.4",
  "tree-sitter-go>=0.25.0",
  "tree-sitter-java>=0.23.5",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-ruby>=0.23.1",
  "tree-sitter-rust>=0.24.2",
  "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
# Exact token counts from local tokenizer.json files (SPEC §9, ADR 0024). Without it, counts come
# from a model server's tokenize route or are flagged estimates. It brings the model hub client
# and its dependencies with it; Stepswitch never calls the hub through it.
tokens = [
  "tokenizers>=0.22",
]

[project.scripts]
ssw = "stepswitch.cli:main"
stepswitch = "stepswitch.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.17",
  "mypy>=2.4",
]
# Browser smoke test of the dashboard (tests/e2e): `uv sync --group e2e`, then a Chrome install
# or `uv run playwright install chromium`.
e2e = [
  "playwright>=1.64",
]
# The docs site (ADR 0032): `uv sync --group docs`, then
# `uv run python -m sphinx -W --keep-going -b html docs docs/_build/html`.
docs = [
  "sphinx>=9.0.4,<10",
  "myst-parser>=5.1,<6",
  "furo>=2025.12.19",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The built dashboard is gitignored, so the sdist lists it as an artifact: release builds
# make the wheel from the sdist (`uv build --no-sources`), and the wheel hook needs it there.
artifacts = ["dashboard/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/stepswitch"]

[tool.hatch.build.targets.wheel.force-include]
# The model and worker registry ships inside the package (ADR 0002, ADR 0012), and so do the
# science-track glossaries (SPEC §6.2) and the built-in bench suites with their repositories and
# golden patches (SPEC §16).
"registry" = "stepswitch/_registry"
# The open specs (HANDOFF v0.1 schema, edit format) that the code validates against.
"spec" = "stepswitch/_spec"
"science/glossaries" = "stepswitch/_science/glossaries"
"bench/suites" = "stepswitch/_bench/suites"
"bench/repos" = "stepswitch/_bench/repos"
"bench/golden" = "stepswitch/_bench/golden"

[tool.hatch.build.targets.wheel.hooks.custom]
# hatch_build.py adds the built dashboard (dashboard/dist) as stepswitch/_dashboard when it exists.

[tool.uv]
# uv-managed interpreters bundle a SQLite without the WAL-reset bug (ADR 0002).
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
  "claim(id): links a claim test to an entry in claims/claims.yaml (SPEC §18.2)",
  "live: needs a running model server or the model hub (STEPSWITCH_LIVE_HUB=1); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["stepswitch"]

[[tool.mypy.overrides]]
# jsonschema ships no type information and its stub package is not a dependency.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
