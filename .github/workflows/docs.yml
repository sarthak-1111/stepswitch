# The docs site (ADR 0032): built with warnings as errors on each push and pull request, and
# uploaded as an artifact. Publishing it to a host needs the repository's public home.
# Actions are pinned to commit SHAs (tags verified 2026-10-19).
name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build the docs site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --group docs
      - name: Build the site
        run: uv run --no-sync python -m sphinx -W --keep-going -b html docs/site docs/site/_build/html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/site/_build/html
          if-no-files-found: error
