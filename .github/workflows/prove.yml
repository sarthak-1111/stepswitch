# Claims verification on pinned hosted runners (SPEC §18.4, claim C-016, ADR 0011).
# Each platform runs the test suite and `ssw prove --quick`; the aggregation job combines the
# three prove reports into claims/evidence/C-016.json and validates C-016 against it.
# Actions are pinned to commit SHAs (tags verified 2026-10-16).
name: prove

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  quick:
    name: prove --quick (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-26
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      STEPSWITCH_RUNNER_LABEL: ${{ matrix.runner }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --extra tokens
      - name: Allow unprivileged network namespaces (OS isolation for C-006 and C-007)
        if: matrix.os == 'linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv run pytest -q
      - name: ssw prove --quick
        shell: bash
        run: uv run ssw prove --quick --skip-claim C-016
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prove-${{ matrix.os }}
          path: |
            claims/prove-report.json
            claims/prove-report.md
            claims/evidence/
          if-no-files-found: warn

  dashboard:
    # The dashboard is built with npm, then served by `ssw dash` code to the runner's Chrome
    # (tests/e2e). Node 24 is the active LTS line (checked 2026-10-16).
    name: dashboard build and browser smoke test
    runs-on: ubuntu-24.04
    env:
      STEPSWITCH_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --extra tokens --group e2e
      - name: Browser smoke test
        run: uv run --group e2e pytest tests/e2e -q
      - name: Phase 4 checks
        run: uv run --group e2e python scripts/phase_check.py 4

  platforms:
    name: platform evidence (C-016)
    needs: quick
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --extra tokens
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports
      - name: Combine platform reports
        run: >-
          uv run python scripts/platform_evidence.py
          reports/prove-linux reports/prove-macos reports/prove-windows
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Validate C-016
        run: uv run ssw prove --quick --claim C-016 --strict
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-evidence
          path: |
            claims/evidence/C-016.json
            claims/prove-report.json
            claims/prove-report.md
