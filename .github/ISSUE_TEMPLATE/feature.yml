name: Feature request
description: An idea for Stepswitch.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work. Mention the SPEC section it touches, if you know it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other designs you considered.
