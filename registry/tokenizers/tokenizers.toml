# Tokenizer files for exact token counts (SPEC §9, ADR 0024). A model entry names its own with
# `tokenizer = "<name>"`; models without an entry (endpoint models) are mapped by `match`, a
# list of glob patterns over the lowercase model name. `ssw models pull --tokenizers` downloads
# the files into <models_dir>/tokenizers/<name>/ and checks them against `sha256`. Nothing is
# downloaded while a task runs. Facts checked on the model hub on the date in `verified`
# (docs/RESEARCH.md, "Tokenizer files").
schema = 1

