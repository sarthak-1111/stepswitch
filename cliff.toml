# The changelog, from conventional commits (git-cliff 2.14). The release workflow writes each
# release's notes with `git-cliff --latest --strip header`; `git-cliff --unreleased` previews
# the next one.

[changelog]
header = """
# Changelog

Generated from the commit history by git-cliff. Commit messages follow conventional commits.
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^test", group = "<!-- 4 -->Tests and claims" },
  { message = "^chore\\(claims\\)", group = "<!-- 4 -->Tests and claims" },
  { message = "^(chore|build|ci|refactor|style)", group = "<!-- 5 -->Maintenance" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
